
name: Life Project CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Unity Structure
    runs-on: [self-hosted, Windows, X64, unity6]

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Unity project
        run: |
          if (!(Test-Path "Assets" -PathType Container)) {
            throw "Assets directory not found"
          }

          if (!(Test-Path "Packages/manifest.json" -PathType Leaf)) {
            throw "manifest.json not found"
          }

          if (!(Test-Path "ProjectSettings/ProjectVersion.txt" -PathType Leaf)) {
            throw "ProjectVersion.txt not found"
          }

          Write-Host "LIFE PROJECT validation passed!"

      - name: Check Unity installation
        run: |
          $unityPath = "C:\Program Files\Unity\Hub\Editor"

          if (!(Test-Path $unityPath)) {
            throw "Unity installation not found"
          }

          Get-ChildItem $unityPath -Directory |
            Select-Object Name, FullName
